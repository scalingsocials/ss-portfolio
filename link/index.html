<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Link Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;600;700;800&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161A;--paper:#fff;--mute:#6B6B76;--rule:#E4E4EC;--peri:#4F52DB;--peri-deep:#3E40BE;--lilac:#E7E7FB;--mint:#D6EAE6;--butter:#F2E3A8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#E9E8EF;color:var(--ink);font-family:"Anek Latin",system-ui,sans-serif;display:grid;place-items:center;padding:20px 16px}
.card{background:var(--paper);border-radius:24px;max-width:560px;width:100%;padding:32px 28px;box-shadow:0 20px 60px #1d1b3a1f}
img{width:170px;height:auto}
h1{font-size:40px;line-height:1.05;letter-spacing:-.03em;margin:26px 0 8px}
h1 span{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-weight:400;color:var(--peri)}
p.lead{color:var(--mute);font-size:17px;line-height:1.45;margin:0 0 24px}
label{display:block;font-weight:600;font-size:15px;margin:16px 0 6px}
label small{font-weight:400;color:var(--mute)}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--rule);border-radius:12px;background:#fafafe}
input:focus{outline:none;border-color:var(--peri);background:#fff}
.out{margin-top:24px;background:var(--lilac);border-radius:16px;padding:16px}
.out code{display:block;font-size:14px;word-break:break-all;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button,a.b{border:0;font:inherit;font-weight:700;font-size:16px;padding:12px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.p{background:var(--ink);color:#fff}.s{background:#fff;color:var(--ink);border:1.5px solid var(--rule)}
.hint{font-size:13px;color:var(--mute);margin-top:12px}
.err{color:#B3261E;font-size:14px;margin-top:6px;min-height:1em}
</style>
</head>
<body>
<main class="card">
  <img src="../m/lockup-black.webp" alt="Scaling Socials">
  <h1>Portfolio <span>link maker</span></h1>
  <p class="lead">Make a portfolio link for a client. The cover shows their brand name, and the last slide sends them to your WhatsApp, not the company number.</p>

  <label for="brand">Client brand <small>(optional, shows on the cover)</small></label>
  <input id="brand" placeholder="e.g. House of Albeli" autocomplete="off">
  <label for="by">Your name</label>
  <input id="by" placeholder="e.g. Harsh Kumar" autocomplete="name">
  <label for="wa">Your WhatsApp number <small>(with country code)</small></label>
  <input id="wa" placeholder="e.g. 91 98765 43210" inputmode="tel" autocomplete="tel">
  <div class="err" id="err"></div>

  <div class="out">
    <code id="link"></code>
    <div class="row">
      <button type="button" class="p" id="copy">Copy link</button>
      <a class="b s" id="share" href="#" target="_blank" rel="noopener">Send on WhatsApp</a>
      <a class="b s" id="open" href="#" target="_blank" rel="noopener">Preview</a>
    </div>
  </div>
  <p class="hint">Your name and number are remembered on this device only, so next time you just change the brand.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const BASE=location.origin+location.pathname.replace(/link\/?(index\.html)?$/,'');
try{ $('by').value=localStorage.getItem('ss_by')||''; $('wa').value=localStorage.getItem('ss_wa')||''; }catch(e){}
function slug(s){ return s.trim().toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function build(){
  const by=$('by').value.trim(), wa=$('wa').value.replace(/\D/g,''), brand=slug($('brand').value);
  let err=''; if(wa && wa.length<10) err='That number looks too short. Include the country code, e.g. 91.';
  if(wa.length===10) err='Add the country code in front, e.g. 91 for India.';
  $('err').textContent=err;
  const q=new URLSearchParams(); if(by) q.set('by',by); if(wa.length>=11) q.set('wa',wa);
  const url=BASE+(q.toString()?'?'+q.toString():'')+(brand?'#for-'+brand:'');
  $('link').textContent=url; $('open').href=url;
  const msg=`Hi${$('brand').value.trim()?' '+$('brand').value.trim()+' team':''}, here's our portfolio with results, creatives and how we work: ${url}`;
  $('share').href='https://wa.me/?text='+encodeURIComponent(msg);
  try{ localStorage.setItem('ss_by',by); localStorage.setItem('ss_wa',$('wa').value); }catch(e){}
}
['brand','by','wa'].forEach(i=>$(i).addEventListener('input',build)); build();
$('copy').onclick=async()=>{ const u=$('link').textContent; try{ await navigator.clipboard.writeText(u); }catch(e){ const r=document.createRange(); r.selectNodeContents($('link')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); } $('copy').textContent='Copied'; setTimeout(()=>$('copy').textContent='Copy link',1500); };
</script>
</body>
</html>
